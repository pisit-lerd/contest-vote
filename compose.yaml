# docker compose up -d --build   → http://<this machine's IP>:3000
# Settings come from .env (cp .env.example .env). Set PUBLIC_URL there to this machine's address.
services:
  vote:
    build: .
    image: contest-vote
    restart: unless-stopped
    init: true
    ports:
      # HOST_PORT in .env picks the port on this machine (default 3000); PUBLIC_URL must use the same one
      - "${HOST_PORT:-3000}:3000"
      # with HTTPS_PORT=3443 in .env, also publish it on the same number:
      # - "3443:3443"
    env_file:
      - path: .env
        required: false
    volumes:
      - vote-data:/data
      # Google Drive key: put it in ./secrets/ (never in the image) and set
      # GDRIVE_KEY_FILE=./secrets/gdrive-key.json in .env; chmod 644 the file on Linux (the app runs as uid 1000)
      - ./secrets:/app/secrets:ro
    # the app writes only to /data; everything else in the container is read-only
    read_only: true
    tmpfs:
      - /tmp
    # it listens on a port above 1024 and never changes user, so it needs no Linux capabilities
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # caps the damage of a flood or a leak: about 4x what 200 phones voting at once use
    mem_limit: 512m
    pids_limit: 200
    # run one instance only: data lives in the process's memory
volumes:
  vote-data:
